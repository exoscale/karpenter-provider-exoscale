apiVersion: apps/v1
kind: Deployment
metadata:
  name: karpenter-exoscale
  labels:
    app: karpenter-exoscale
  namespace: kube-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: karpenter-exoscale
  template:
    metadata:
      labels:
        app: karpenter-exoscale
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: karpenter-exoscale
                topologyKey: "kubernetes.io/hostname"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1997
        fsGroup: 2000
      serviceAccountName: karpenter
      containers:
        - name: karpenter
          image: docker.io/exoscale/karpenter:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: EXOSCALE_API_KEY
              valueFrom: { secretKeyRef: { name: karpenter-exoscale, key: api-key } }
            - name: EXOSCALE_API_SECRET
              valueFrom: { secretKeyRef: { name: karpenter-exoscale, key: api-secret } }
            - name: EXOSCALE_ZONE
              valueFrom: { secretKeyRef: { name: karpenter-exoscale, key: zone } }
            - name: EXOSCALE_SKS_CLUSTER_ID
              valueFrom: { secretKeyRef: { name: karpenter-exoscale, key: cluster-id } }
            # Nodes join through this endpoint: the in-cluster API server address
            # is a service IP they can't reach before they joined.
            - name: CLUSTER_ENDPOINT
              valueFrom: { secretKeyRef: { name: karpenter-exoscale, key: cluster-endpoint } }
            - name: USE_SKS_DEFAULT_SECURITY_GROUP
              valueFrom: { secretKeyRef: { name: karpenter-exoscale, key: use-sks-default-security-group, optional: true } }
          ports:
            - containerPort: 8080
              name: metrics
              protocol: TCP
            - containerPort: 8081
              name: http
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
