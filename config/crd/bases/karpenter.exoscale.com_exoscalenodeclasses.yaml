                    name:
                      type: string
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one of id or name must be specified
                    rule: (has(self.id) && !has(self.name)) || (!has(self.id) && has(self.name))
                maxItems: 7
                type: array
            type: object
            x-kubernetes-validations:
            - message: imageGCLowThresholdPercent must be less than imageGCHighThresholdPercent
