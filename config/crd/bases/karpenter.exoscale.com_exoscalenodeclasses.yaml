                properties:
                  id:
                    type: string
                  name:
                    type: string
                type: object
                x-kubernetes-validations:
                - message: exactly one of id or name must be specified
                  rule: (has(self.id) && !has(self.name)) || (!has(self.id) && has(self.name))
              vpcSubnetSelectorTerms:
                description: |-
                  VpcSubnetSelectorTerms selects the subnets of vpcSelector's VPC to attach
