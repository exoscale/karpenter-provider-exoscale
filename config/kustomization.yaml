kind: Kustomization
apiVersion: kustomize.config.k8s.io/v1beta1

# Install the CRDs first: kubectl apply -k config/crd/bases
# The Deployment reads its settings from the karpenter-exoscale Secret, see README.md.
namespace: kube-system
resources:
  - service-account.yaml
  - rbac/role.yaml
  - rbac/clusterrolebinding.yaml
  - deployment.yaml
  - service.yaml
  - poddisruptionbudget.yaml
# Optional, they need the Prometheus operator and the VPA CRDs:
# - servicemonitor.yaml
# - verticalpodautoscaler.yaml
