name: CI

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "**.md"
    tags-ignore:
      - "v**" # Don't run CI tests on release tags

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: make go.mk
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: 'go.mod'

      - run: make pre-check

      - name: Run tests
        run: make test-verbose

  build:
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: make go.mk
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: 'go.mod'
      - name: Build
        run: make build

  docker-build:
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: make go.mk
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: 'go.mod'
      - name: Build Docker image
        run: make docker
