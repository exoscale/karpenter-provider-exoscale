apiVersion: karpenter.exoscale.com/v1
kind: ExoscaleNodeClass
metadata:
  name: gpu-nvidia
spec:
  # Omit 'version' to use the control plane version.
  imageTemplateSelector:
    version: "1.34.1"
    variant: "nvidia"

  diskSize: 50

  securityGroupSelectorTerms: []
  # - id: "123e4567-e89b-12d3-a456-426614174000"
  # - name: "my-security-group"

  # Spread GPU nodes across hypervisors
  antiAffinityGroupSelectorTerms: []
  # - name: "my-anti-affinity-group"

  # VPC holding the subnets below. Required when vpcSubnetSelectorTerms is set.
  # vpcSelector:
  #   name: "my-vpc"

  # Subnets of the selected VPC (max 7)
  vpcSubnetSelectorTerms: []
  # - name: "my-subnet"

  elasticIPSelectorTerms: []
  # - name: "203.0.113.42"

# GPU labels and taints are set on the NodePool, see nodepool-gpu.yaml.
