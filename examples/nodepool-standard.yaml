apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: standard
spec:
  template:
    metadata:
      labels:
        nodepool: standard
    spec:
      nodeClassRef:
        group: karpenter.exoscale.com
        kind: ExoscaleNodeClass
        name: standard-auto

      # Startup taints prevent scheduling until node is fully ready
      startupTaints: []

      requirements:
        - key: "node.kubernetes.io/instance-type"
          operator: In
          values:
            - "standard.medium"
            - "standard.large"
            - "standard.extra-large"

      # Replace nodes after 30 days to pick up OS updates
      expireAfter: 720h

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized

    consolidateAfter: 30m

    budgets:
      - nodes: "10%" # Disrupt at most 10% of nodes at once

  # Higher weight wins when several NodePools match
  weight: 50
