apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu
spec:
  template:
    metadata:
      labels:
        nodepool: gpu
        workload-type: gpu
    spec:
      nodeClassRef:
        group: karpenter.exoscale.com
        kind: ExoscaleNodeClass
        name: gpu-nvidia

      # Startup taints prevent scheduling until node is fully ready
      startupTaints:
        - key: karpenter.sh/unregistered
          effect: NoExecute

      requirements:
        - key: "node.kubernetes.io/instance-type"
          operator: In
          values:
            - "gpua30.small"
            - "gpua30.medium"
            - "gpua30.large"

      # Only pods tolerating this taint run on GPU nodes
      taints:
        - key: "nvidia.com/gpu"
          value: "true"
          effect: "NoSchedule"

      # Expire GPU nodes after 30 days
      expireAfter: 720h

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized

    consolidateAfter: 1m

    budgets:
      - nodes: "100%"

  # Lower weight: prefer the standard pool when both fit
  weight: 10
