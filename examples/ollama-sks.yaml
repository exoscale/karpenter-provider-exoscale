apiVersion: karpenter.exoscale.com/v1
kind: ExoscaleNodeClass
metadata:
  name: gpu-nvidia
spec:
  # Omit 'version' to use the control plane version
  imageTemplateSelector:
    version: "1.35.0"
    variant: "nvidia"

  securityGroupSelectorTerms: []
  diskSize: 200
---
apiVersion: karpenter.exoscale.com/v1
kind: ExoscaleNodeClass
metadata:
  name: standard
spec:
  # Alternative to templateID: pick the SKS template by Kubernetes version and variant
  imageTemplateSelector:
    # Kubernetes version ("1.34.1"); omit to use the control plane version
    version: "1.35.0"

    # "standard" (default) or "nvidia"
    variant: "standard"

  securityGroupSelectorTerms: []
  # Disk size in GB (default: 50, min: 10, max: 8000)
  diskSize: 50
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: standard
spec:
  template:
    metadata:
      labels:
        nodepool: standard
    spec:
      nodeClassRef:
        group: karpenter.exoscale.com
        kind: ExoscaleNodeClass
        name: standard

      # Startup taints prevent scheduling until node is fully ready
      startupTaints: []

      requirements:
        - key: "node.kubernetes.io/instance-type"
          operator: In
          values:
            - "standard.medium"
            - "standard.large"
            - "standard.extra-large"

      # Replace nodes after 30 days to pick up OS updates
      expireAfter: 720h

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized

    consolidateAfter: 1m

    budgets:
      - nodes: "10%" # Disrupt at most 10% of nodes at once

  # Higher weight wins when several NodePools match
  weight: 50
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu
spec:
  template:
    metadata:
      labels:
        nodepool: gpu
        workload-type: gpu
    spec:
      nodeClassRef:
        group: karpenter.exoscale.com
        kind: ExoscaleNodeClass
        name: gpu-nvidia

      # Startup taints prevent scheduling until node is fully ready
      startupTaints:
        - key: karpenter.sh/unregistered
          effect: NoExecute

      requirements:
        - key: "node.kubernetes.io/instance-type"
          operator: In
          values:
            - "gpurtx6000pro.small"
        - key: "topology.csi.exoscale.com/zone"
          operator: In
          values: ["ch-gva-2"]

      # Only pods tolerating this taint run on GPU nodes
      taints:
        - key: "nvidia.com/gpu"
          value: "true"
          effect: "NoSchedule"

      # Expire GPU nodes after 30 days
      expireAfter: 720h

  limits:
    nodes: 2
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized

    consolidateAfter: 30m

    budgets:
      - nodes: "100%"

  # Lower weight: prefer the standard pool when both fit
  weight: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      tolerations:
        - key: "nvidia.com/gpu"
          value: "true"
          effect: "NoSchedule"
      containers:
        - name: ollama
          image: ollama/ollama:latest
          command: ["/bin/sh", "-c"]
          args:
            - "ollama serve & sleep 5 && ollama pull mistral && wait"
          ports:
            - containerPort: 11434  # expose Ollama API port
          resources:
            limits:
              cpu: "10"
              memory: 20G
              nvidia.com/gpu: "1"
            requests:
              cpu: "2"
              memory: 6G
              nvidia.com/gpu: "1"
